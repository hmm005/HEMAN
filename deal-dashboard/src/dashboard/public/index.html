<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal Dashboard | Elevate Home Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    :root{
      --bg:#0a0a0a;
      --surface:#111113;
      --card:#161618;
      --border:#252528;
      --text:#e8e8ec;
      --muted:#7a7a85;
      --gold:#c9a84c;
      --gold-dim:rgba(201,168,76,0.15);
      --green:#2ecc71;
      --red:#e74c3c;
      --sidebar-w:280px;
    }

    body{
      font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size:40px 40px;
      min-height:100vh;
    }

    /* ── HEADER ── */
    header{
      position:sticky;top:0;z-index:50;
      background:rgba(17,17,19,0.95);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:0 24px;
      height:56px;
      display:flex;align-items:center;justify-content:space-between;
    }

    .logo{display:flex;align-items:center;gap:12px;}
    .logo h1{
      font-family:'Bebas Neue',sans-serif;
      font-size:26px;letter-spacing:2px;
      color:var(--text);font-weight:400;
    }
    .logo .badge{
      background:var(--gold);color:#0a0a0a;
      font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
      padding:2px 8px;border-radius:3px;letter-spacing:1px;
      text-transform:uppercase;
    }
    .status-dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--green);display:inline-block;
      margin-left:12px;
      animation:pulse 2s ease-in-out infinite;
    }
    .status-dot.scanning{background:var(--gold);animation:pulse 0.6s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(46,204,113,0.4);}50%{opacity:0.6;box-shadow:0 0 0 6px rgba(46,204,113,0);}}

    .header-actions{display:flex;gap:8px;align-items:center;}

    button{
      font-family:'DM Mono',monospace;font-size:12px;font-weight:500;
      border:none;padding:8px 16px;border-radius:4px;cursor:pointer;
      text-transform:uppercase;letter-spacing:0.5px;transition:all 0.2s;
    }
    button:hover{transform:translateY(-1px);}
    button:active{transform:translateY(0);}
    button:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

    .btn-primary{background:var(--gold);color:#0a0a0a;}
    .btn-secondary{background:var(--border);color:var(--text);}
    .btn-danger{background:var(--red);color:white;}

    /* ── LAYOUT ── */
    .layout{display:flex;min-height:calc(100vh - 56px);}

    /* ── SIDEBAR ── */
    .sidebar{
      width:var(--sidebar-w);min-width:var(--sidebar-w);
      background:var(--surface);border-right:1px solid var(--border);
      padding:20px 0;overflow-y:auto;
      position:sticky;top:56px;height:calc(100vh - 56px);
    }

    .sidebar-section{padding:0 16px;margin-bottom:24px;}
    .sidebar-section h3{
      font-family:'Bebas Neue',sans-serif;font-size:14px;
      color:var(--muted);letter-spacing:2px;
      margin-bottom:10px;padding-bottom:6px;
      border-bottom:1px solid var(--border);
    }

    .stat-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:6px 0;
    }
    .stat-row .label{font-size:13px;color:var(--muted);}
    .stat-row .value{
      font-family:'DM Mono',monospace;font-size:15px;font-weight:500;
      color:var(--gold);
    }

    .watchlist-nav{list-style:none;}
    .watchlist-nav li{
      padding:8px 16px;cursor:pointer;
      font-size:13px;color:var(--muted);
      border-left:3px solid transparent;
      transition:all 0.15s;
      display:flex;align-items:center;justify-content:space-between;
    }
    .watchlist-nav li:hover{background:rgba(255,255,255,0.03);color:var(--text);}
    .watchlist-nav li.active{
      border-left-color:var(--gold);color:var(--text);
      background:rgba(201,168,76,0.05);
    }
    .watchlist-nav li .dot{
      width:6px;height:6px;border-radius:50%;
      display:inline-block;margin-right:8px;flex-shrink:0;
    }
    .watchlist-nav li .dot.on{background:var(--green);}
    .watchlist-nav li .dot.off{background:var(--muted);}
    .watchlist-nav li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .watchlist-nav li .count{
      font-family:'DM Mono',monospace;font-size:11px;
      background:var(--border);color:var(--muted);
      padding:1px 6px;border-radius:8px;margin-left:6px;flex-shrink:0;
    }

    .source-list{list-style:none;}
    .source-list li{
      display:flex;justify-content:space-between;
      padding:3px 0;font-size:12px;color:var(--muted);
    }
    .source-list li .c{font-family:'DM Mono',monospace;color:var(--text);font-size:11px;}

    /* ── MAIN ── */
    .main{flex:1;padding:24px 28px;overflow-y:auto;}

    .page-title{
      font-family:'Bebas Neue',sans-serif;font-size:32px;
      letter-spacing:2px;margin-bottom:16px;color:var(--text);
    }

    .filter-chips{
      display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;
    }
    .chip{
      font-family:'DM Mono',monospace;font-size:11px;
      padding:5px 12px;border-radius:3px;cursor:pointer;
      background:var(--card);border:1px solid var(--border);
      color:var(--muted);transition:all 0.15s;text-transform:uppercase;
      letter-spacing:0.5px;
    }
    .chip:hover{border-color:var(--gold);color:var(--text);}
    .chip.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

    /* ── CARDS GRID ── */
    .cards-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
      gap:14px;
    }

    .listing-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:6px;padding:16px;
      transition:border-color 0.2s,transform 0.2s;
      opacity:0;animation:fadeSlide 0.4s ease forwards;
    }
    .listing-card:hover{border-color:var(--gold);transform:translateY(-2px);}
    .listing-card.auction{border-left:3px solid var(--gold);}

    @keyframes fadeSlide{
      from{opacity:0;transform:translateY(12px);}
      to{opacity:1;transform:translateY(0);}
    }

    .card-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:8px;
    }
    .source-badge{
      font-family:'DM Mono',monospace;font-size:10px;
      padding:2px 8px;border-radius:3px;text-transform:uppercase;
      letter-spacing:0.5px;font-weight:500;
    }
    .badge-craigslist{background:#1a3a2a;color:#4ade80;}
    .badge-ebay{background:#3a2a1a;color:#fbbf24;}
    .badge-autotrader{background:#1a2a3a;color:#60a5fa;}
    .badge-cargurus{background:#2a1a3a;color:#a78bfa;}
    .badge-carsdotcom{background:#1a3a3a;color:#2dd4bf;}
    .badge-copart,.badge-iaai,.badge-govplanet,.badge-publicsurplus{background:#3a3a1a;color:#c9a84c;}
    .badge-bizbuysell,.badge-bizquest{background:#3a1a2a;color:#f472b6;}
    .badge-hemmings,.badge-truckpaper,.badge-carsforsale,.badge-carsdirect{background:#2a2a1a;color:#d4d4d8;}
    .badge-default{background:var(--border);color:var(--muted);}

    .auction-tag{
      font-family:'DM Mono',monospace;font-size:10px;
      background:var(--gold-dim);color:var(--gold);
      padding:2px 6px;border-radius:3px;margin-left:6px;
    }
    .time-ago{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}

    .card-title{
      font-size:14px;font-weight:600;line-height:1.4;margin-bottom:8px;
    }
    .card-title a{color:var(--text);text-decoration:none;transition:color 0.15s;}
    .card-title a:hover{color:var(--gold);}

    .card-price{
      font-family:'DM Mono',monospace;font-size:20px;font-weight:500;
      margin-bottom:8px;
    }
    .card-price.sale{color:var(--green);}
    .card-price.auction{color:var(--gold);}

    .card-meta{
      display:flex;gap:12px;flex-wrap:wrap;
      font-size:12px;color:var(--muted);
    }
    .card-meta span{display:flex;align-items:center;gap:4px;}

    .auction-end{
      font-size:11px;color:var(--gold);
      font-family:'DM Mono',monospace;
      margin-top:6px;padding-top:6px;
      border-top:1px solid var(--border);
    }

    /* ── EMPTY STATE ── */
    .empty-state{
      text-align:center;padding:80px 20px;
      grid-column:1/-1;
    }
    .empty-state h3{
      font-family:'Bebas Neue',sans-serif;font-size:24px;
      letter-spacing:2px;color:var(--muted);margin-bottom:8px;
    }
    .empty-state p{color:var(--muted);font-size:14px;}

    /* ── MODAL ── */
    .modal-overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,0.8);z-index:100;
      align-items:center;justify-content:center;
    }
    .modal-overlay.active{display:flex;}
    .modal{
      background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:28px;
      width:90%;max-width:560px;max-height:90vh;overflow-y:auto;
    }
    .modal h2{
      font-family:'Bebas Neue',sans-serif;font-size:22px;
      letter-spacing:2px;margin-bottom:20px;
    }
    .form-group{margin-bottom:14px;}
    .form-group label{
      display:block;font-size:11px;color:var(--muted);
      font-family:'DM Mono',monospace;text-transform:uppercase;
      letter-spacing:0.5px;margin-bottom:4px;
    }
    .form-group input,.form-group select,.form-group textarea{
      width:100%;background:var(--bg);border:1px solid var(--border);
      color:var(--text);padding:8px 12px;border-radius:4px;
      font-family:'Instrument Sans',sans-serif;font-size:14px;
      transition:border-color 0.15s;
    }
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
      outline:none;border-color:var(--gold);
    }
    .form-group textarea{resize:vertical;min-height:60px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .modal-actions{display:flex;gap:8px;margin-top:20px;}

    /* ── RESPONSIVE ── */
    @media(max-width:900px){
      .sidebar{display:none;}
      .cards-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <h1>DEAL DASHBOARD</h1>
    <span class="badge">ELEVATE</span>
    <span class="status-dot" id="statusDot" title="System active"></span>
  </div>
  <div class="header-actions">
    <button class="btn-primary" id="scanBtn" onclick="triggerScan()">SCAN NOW</button>
    <button class="btn-secondary" onclick="openModal()">+ ADD ALERT</button>
  </div>
</header>

<div class="layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>STATS</h3>
      <div class="stat-row"><span class="label">Total Tracked</span><span class="value" id="statTotal">0</span></div>
      <div class="stat-row"><span class="label">Found Today</span><span class="value" id="statToday">0</span></div>
    </div>

    <div class="sidebar-section">
      <h3>WATCHLISTS</h3>
      <ul class="watchlist-nav" id="watchlistNav">
        <li class="active" data-wid="all" onclick="selectWatchlist('all',this)">
          <span class="name">All Listings</span>
        </li>
      </ul>
    </div>

    <div class="sidebar-section">
      <h3>SOURCES</h3>
      <ul class="source-list" id="sourceList"></ul>
    </div>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <main class="main">
    <div class="page-title" id="pageTitle">ALL LISTINGS</div>

    <div class="filter-chips" id="filterChips">
      <span class="chip active" data-src="all" onclick="selectSource('all',this)">All Sources</span>
      <span class="chip" data-src="auction" onclick="selectSource('auction',this)">Auctions Only</span>
      <span class="chip" data-src="Craigslist" onclick="selectSource('Craigslist',this)">Craigslist</span>
      <span class="chip" data-src="eBay Motors" onclick="selectSource('eBay Motors',this)">eBay</span>
      <span class="chip" data-src="AutoTrader" onclick="selectSource('AutoTrader',this)">AutoTrader</span>
      <span class="chip" data-src="CarGurus" onclick="selectSource('CarGurus',this)">CarGurus</span>
    </div>

    <div class="cards-grid" id="cardsGrid">
      <div class="empty-state">
        <h3>NO LISTINGS YET</h3>
        <p>Click SCAN NOW to start searching, or wait for the next scheduled scan.</p>
      </div>
    </div>
  </main>
</div>

<!-- ── ADD ALERT MODAL ── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>ADD NEW ALERT</h2>
    <form id="alertForm" onsubmit="submitAlert(event)">
      <div class="form-group">
        <label>Name</label>
        <input name="name" required placeholder="e.g., 7.3 Powerstroke F250">
      </div>
      <div class="form-group">
        <label>Type</label>
        <select name="type">
          <option value="vehicle">Vehicle</option>
          <option value="business">Business</option>
        </select>
      </div>
      <div class="form-group">
        <label>Keywords (one per line)</label>
        <textarea name="keywords" required placeholder="LBZ&#10;Duramax&#10;6.6 diesel"></textarea>
      </div>
      <div class="form-group">
        <label>Title Must Contain (comma-separated)</label>
        <input name="titleMustContain" placeholder="e.g., LBZ">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Min Price</label>
          <input name="minPrice" type="number" placeholder="5000">
        </div>
        <div class="form-group">
          <label>Max Price</label>
          <input name="maxPrice" type="number" placeholder="45000">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Min Year</label>
          <input name="minYear" type="number" placeholder="2006">
        </div>
        <div class="form-group">
          <label>Max Year</label>
          <input name="maxYear" type="number" placeholder="2007">
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <input name="notes" placeholder="Optional notes about this alert">
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-primary">CREATE ALERT</button>
        <button type="button" class="btn-secondary" onclick="closeModal()">CANCEL</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ── STATE ──
  let allAlerts = [];
  let allWatchlists = [];
  let currentWatchlist = 'all';
  let currentSource = 'all';

  // ── SOURCE BADGE MAPPING ──
  function badgeClass(source) {
    const s = (source||'').toLowerCase();
    if (s.includes('craigslist')) return 'badge-craigslist';
    if (s.includes('ebay')) return 'badge-ebay';
    if (s.includes('autotrader')) return 'badge-autotrader';
    if (s.includes('cargurus')) return 'badge-cargurus';
    if (s.includes('cars.com')) return 'badge-carsdotcom';
    if (s.includes('copart')) return 'badge-copart';
    if (s.includes('iaai')) return 'badge-iaai';
    if (s.includes('govplanet')) return 'badge-govplanet';
    if (s.includes('publicsurplus')) return 'badge-publicsurplus';
    if (s.includes('bizbuysell')) return 'badge-bizbuysell';
    if (s.includes('bizquest')) return 'badge-bizquest';
    if (s.includes('hemmings')) return 'badge-hemmings';
    if (s.includes('truckpaper')) return 'badge-truckpaper';
    if (s.includes('carsforsale')) return 'badge-carsforsale';
    if (s.includes('carsdirect')) return 'badge-carsdirect';
    return 'badge-default';
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  // ── API CALLS ──
  async function loadStats() {
    try {
      const res = await fetch('/api/stats');
      const s = await res.json();
      document.getElementById('statTotal').textContent = s.total.toLocaleString();
      document.getElementById('statToday').textContent = s.today.toLocaleString();

      // Source breakdown
      const sl = document.getElementById('sourceList');
      sl.innerHTML = (s.bySource||[]).map(r =>
        `<li><span>${r.source}</span><span class="c">${r.c}</span></li>`
      ).join('');
    } catch(e) { console.error('Stats error:', e); }
  }

  async function loadAlerts() {
    try {
      const params = new URLSearchParams({ limit: 500 });
      if (currentWatchlist !== 'all') params.set('watchlist', currentWatchlist);
      const res = await fetch('/api/alerts?' + params);
      allAlerts = await res.json();
      renderCards();
    } catch(e) { console.error('Alerts error:', e); }
  }

  async function loadWatchlists() {
    try {
      const res = await fetch('/api/watchlists');
      allWatchlists = await res.json();
      renderWatchlistNav();
    } catch(e) { console.error('Watchlists error:', e); }
  }

  // ── RENDER ──
  function renderWatchlistNav() {
    const nav = document.getElementById('watchlistNav');
    // Count alerts per watchlist
    const counts = {};
    allAlerts.forEach(a => {
      counts[a.watchlist_id] = (counts[a.watchlist_id]||0) + 1;
    });

    let html = `<li class="${currentWatchlist==='all'?'active':''}" data-wid="all" onclick="selectWatchlist('all',this)">
      <span class="name">All Listings</span>
      <span class="count">${allAlerts.length}</span>
    </li>`;

    for (const w of allWatchlists) {
      const isActive = currentWatchlist === w.id;
      const dotClass = w.active !== false ? 'on' : 'off';
      html += `<li class="${isActive?'active':''}" data-wid="${w.id}" onclick="selectWatchlist('${w.id}',this)">
        <span class="dot ${dotClass}"></span>
        <span class="name">${w.name}</span>
        <span class="count">${counts[w.id]||0}</span>
      </li>`;
    }
    nav.innerHTML = html;
  }

  function renderCards() {
    const grid = document.getElementById('cardsGrid');
    let filtered = [...allAlerts];

    // Source filter
    if (currentSource === 'auction') {
      filtered = filtered.filter(a => a.is_auction === 1);
    } else if (currentSource !== 'all') {
      filtered = filtered.filter(a => a.source === currentSource);
    }

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state">
        <h3>NO LISTINGS FOUND</h3>
        <p>Try a different filter or click SCAN NOW to search.</p>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map((a, i) => {
      const isAuction = a.is_auction === 1;
      const priceClass = isAuction ? 'auction' : 'sale';
      const priceStr = a.price ? '$' + Number(a.price).toLocaleString() : 'Price TBD';

      return `<div class="listing-card ${isAuction?'auction':''}" style="animation-delay:${Math.min(i*0.05,1)}s">
        <div class="card-header">
          <div>
            <span class="source-badge ${badgeClass(a.source)}">${a.source||'Unknown'}</span>
            ${isAuction ? '<span class="auction-tag">AUCTION</span>' : ''}
          </div>
          <span class="time-ago">${timeAgo(a.alerted_at)}</span>
        </div>
        <div class="card-title">
          <a href="${a.url||'#'}" target="_blank" rel="noopener">${a.title||'No title'}</a>
        </div>
        <div class="card-price ${priceClass}">${priceStr}</div>
        <div class="card-meta">
          ${a.location ? `<span>&#x1F4CD; ${a.location}</span>` : ''}
          ${a.mileage ? `<span>${a.mileage}</span>` : ''}
          ${a.year ? `<span>${a.year}</span>` : ''}
        </div>
        ${isAuction && a.auction_end ? `<div class="auction-end">&#x23F0; Ends: ${a.auction_end}</div>` : ''}
      </div>`;
    }).join('');
  }

  // ── INTERACTIONS ──
  function selectWatchlist(wid, el) {
    currentWatchlist = wid;
    document.querySelectorAll('.watchlist-nav li').forEach(li => li.classList.remove('active'));
    if (el) el.classList.add('active');

    const wl = allWatchlists.find(w => w.id === wid);
    document.getElementById('pageTitle').textContent = wid === 'all' ? 'ALL LISTINGS' : (wl?.name||'').toUpperCase();

    loadAlerts();
  }

  function selectSource(src, el) {
    currentSource = src;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    renderCards();
  }

  async function triggerScan() {
    const btn = document.getElementById('scanBtn');
    const dot = document.getElementById('statusDot');
    btn.disabled = true;
    btn.textContent = 'SCANNING...';
    dot.classList.add('scanning');

    try {
      await fetch('/api/scan', { method: 'POST' });
      // Poll for new results
      setTimeout(async () => {
        await loadAlerts();
        await loadStats();
        btn.disabled = false;
        btn.textContent = 'SCAN NOW';
        dot.classList.remove('scanning');
      }, 5000);
    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'SCAN NOW';
      dot.classList.remove('scanning');
    }
  }

  function openModal() { document.getElementById('modal').classList.add('active'); }
  function closeModal() { document.getElementById('modal').classList.remove('active'); }

  async function submitAlert(e) {
    e.preventDefault();
    const f = e.target;
    const type = f.type.value;

    const vehicleSources = ['craigslist','ebay','autotrader','cargurus','cars_com','copart','iaai','govplanet','publicsurplus','carsforsale','hemmings','truckpaper','carsdirect'];
    const businessSources = ['bizbuysell','bizquest','craigslist'];
    const defaultCities = ['birmingham','huntsville','atlanta','nashville','memphis','chattanooga','knoxville','montgomery','gadsden','anniston','tuscaloosa'];

    const data = {
      name: f.name.value,
      type,
      keywords: f.keywords.value.split('\n').map(s => s.trim()).filter(Boolean),
      titleMustContain: f.titleMustContain.value ? f.titleMustContain.value.split(',').map(s => s.trim()).filter(Boolean) : [],
      minPrice: f.minPrice.value ? parseInt(f.minPrice.value) : undefined,
      maxPrice: f.maxPrice.value ? parseInt(f.maxPrice.value) : undefined,
      minYear: f.minYear.value ? parseInt(f.minYear.value) : undefined,
      maxYear: f.maxYear.value ? parseInt(f.maxYear.value) : undefined,
      notes: f.notes.value || '',
      sources: type === 'vehicle' ? vehicleSources : businessSources,
      craigslistCities: defaultCities,
    };

    try {
      await fetch('/api/watchlists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      closeModal();
      f.reset();
      await loadWatchlists();
    } catch(e) { console.error('Create alert error:', e); }
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  // ── INIT ──
  (async () => {
    await loadStats();
    await loadAlerts();
    await loadWatchlists();
    renderWatchlistNav();
  })();

  // Auto-refresh every 60 seconds
  setInterval(() => {
    loadStats();
    loadAlerts();
  }, 60000);
</script>

</body>
</html>
