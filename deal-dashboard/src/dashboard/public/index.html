<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal Alert Dashboard | Elevate Home Solutions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --purple: #a855f7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .logo span { color: var(--accent); }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .status-dot.scanning { background: var(--orange); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--border); }
    button.danger { background: var(--red); }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.orange { color: var(--orange); }
    .stat-card .value.purple { color: var(--purple); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 14px;
    }

    .listing-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: border-color 0.2s;
      position: relative;
    }

    .listing-card:hover { border-color: var(--accent); }
    .listing-card.auction { border-left: 3px solid var(--orange); }

    .listing-source {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .listing-score {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .score-high { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .score-mid { background: rgba(245, 158, 11, 0.2); color: var(--orange); }
    .score-low { background: rgba(156, 163, 175, 0.2); color: var(--muted); }

    .listing-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .listing-title a {
      color: var(--text);
      text-decoration: none;
    }

    .listing-title a:hover { color: var(--accent); }

    .listing-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    .listing-meta .price {
      color: var(--green);
      font-weight: 700;
      font-size: 16px;
    }

    .listing-meta .auction-end {
      color: var(--orange);
    }

    .listing-location {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { margin-bottom: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

    .scan-log {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .scan-log h3 { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .scan-log-entry {
      font-size: 12px;
      color: var(--muted);
      padding: 2px 0;
      font-family: monospace;
    }

    @media (max-width: 600px) {
      .listings-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      header { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span>DEAL</span> ALERT DASHBOARD</div>
    <div class="header-actions">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText" style="font-size:13px;color:var(--muted)">Ready</span>
      <button onclick="triggerScan()" id="scanBtn">SCAN NOW</button>
      <button class="secondary" onclick="openModal()">+ Add Alert</button>
    </div>
  </header>

  <div class="container">
    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="label">Total Tracked</div>
        <div class="value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Found Today</div>
        <div class="value green" id="statToday">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Sources Active</div>
        <div class="value orange" id="statSources">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Watchlists</div>
        <div class="value purple" id="statWatchlists">—</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="source:Craigslist">Craigslist</button>
      <button class="filter-btn" data-filter="source:eBay Motors">eBay</button>
      <button class="filter-btn" data-filter="source:AutoTrader">AutoTrader</button>
      <button class="filter-btn" data-filter="source:CarGurus">CarGurus</button>
      <button class="filter-btn" data-filter="source:Cars.com">Cars.com</button>
      <button class="filter-btn" data-filter="auction">Auctions Only</button>
    </div>

    <!-- Watchlist filters -->
    <div class="filters" id="watchlistFilters"></div>

    <!-- Scan Log -->
    <div class="scan-log" id="scanLog" style="display:none">
      <h3>Recent Scans</h3>
      <div id="scanLogEntries"></div>
    </div>

    <!-- Listings -->
    <div class="listings-grid" id="listingsGrid">
      <div class="empty-state">
        <h3>No listings yet</h3>
        <p>Click SCAN NOW to start searching, or wait for the next scheduled scan.</p>
      </div>
    </div>
  </div>

  <!-- Add Alert Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>Add New Alert</h2>
      <form id="alertForm" onsubmit="submitAlert(event)">
        <div class="form-group">
          <label>Alert Name</label>
          <input name="name" required placeholder="e.g., 7.3 Powerstroke F250">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select name="type">
            <option value="vehicle">Vehicle</option>
            <option value="business">Business</option>
          </select>
        </div>
        <div class="form-group">
          <label>Keywords (comma-separated)</label>
          <input name="keywords" required placeholder="e.g., 7.3, Powerstroke, 7.3L diesel">
        </div>
        <div class="form-group">
          <label>Title Must Contain (comma-separated, optional)</label>
          <input name="titleMustContain" placeholder="e.g., 7.3">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Min Year</label>
            <input name="minYear" type="number" placeholder="1999">
          </div>
          <div class="form-group">
            <label>Max Year</label>
            <input name="maxYear" type="number" placeholder="2003">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Min Price ($)</label>
            <input name="minPrice" type="number" placeholder="5000">
          </div>
          <div class="form-group">
            <label>Max Price ($)</label>
            <input name="maxPrice" type="number" placeholder="30000">
          </div>
        </div>
        <div class="form-group">
          <label>Craigslist Cities (comma-separated)</label>
          <input name="craigslistCities" placeholder="birmingham, huntsville, atlanta, nashville">
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button type="submit">Create Alert</button>
          <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentFilter = 'all';
    let currentWatchlist = null;

    async function loadListings() {
      const params = new URLSearchParams({ limit: 200 });

      if (currentFilter.startsWith('source:')) {
        params.set('source', currentFilter.replace('source:', ''));
      }
      if (currentWatchlist) {
        params.set('watchlist', currentWatchlist);
      }

      const res = await fetch('/api/listings?' + params);
      let listings = await res.json();

      if (currentFilter === 'auction') {
        listings = listings.filter(l =>
          l.source.toLowerCase().includes('auction') ||
          ['copart', 'iaai', 'govplanet', 'publicsurplus'].some(s => l.source.toLowerCase().includes(s))
        );
      }

      // Sort by score descending
      listings.sort((a, b) => (b.score || 0) - (a.score || 0));

      renderListings(listings);
    }

    function renderListings(listings) {
      const grid = document.getElementById('listingsGrid');

      if (!listings.length) {
        grid.innerHTML = `<div class="empty-state"><h3>No listings found</h3><p>Try a different filter or run a scan.</p></div>`;
        return;
      }

      grid.innerHTML = listings.map(l => {
        const isAuction = l.source?.toLowerCase().includes('auction') ||
          ['copart', 'iaai', 'govplanet', 'publicsurplus'].some(s => l.source?.toLowerCase().includes(s));
        const scoreClass = l.score >= 70 ? 'score-high' : l.score >= 50 ? 'score-mid' : 'score-low';

        return `
          <div class="listing-card ${isAuction ? 'auction' : ''}">
            <div class="listing-source">
              <span>${isAuction ? '🔨 ' : ''}${l.source || 'Unknown'}</span>
              <span class="listing-score ${scoreClass}">${l.score || 0}</span>
            </div>
            <div class="listing-title">
              <a href="${l.url || '#'}" target="_blank" rel="noopener">${l.title || 'No title'}</a>
            </div>
            <div class="listing-meta">
              ${l.price ? `<span class="price">$${Number(l.price).toLocaleString()}</span>` : ''}
              ${l.mileage ? `<span>${Number(l.mileage).toLocaleString()} mi</span>` : ''}
              ${l.year ? `<span>${l.year}</span>` : ''}
              ${l.auction_end ? `<span class="auction-end">Ends: ${l.auction_end}</span>` : ''}
            </div>
            <div class="listing-location">${l.location || ''}</div>
          </div>
        `;
      }).join('');
    }

    async function loadStats() {
      const res = await fetch('/api/stats');
      const stats = await res.json();

      document.getElementById('statTotal').textContent = stats.total.toLocaleString();
      document.getElementById('statToday').textContent = stats.today.toLocaleString();
      document.getElementById('statSources').textContent = stats.bySource.length;
      document.getElementById('statWatchlists').textContent = stats.byWatchlist.length;

      // Show scan log
      if (stats.recentScans.length > 0) {
        document.getElementById('scanLog').style.display = 'block';
        document.getElementById('scanLogEntries').innerHTML = stats.recentScans.map(s =>
          `<div class="scan-log-entry">${s.scan_time} | ${s.source} | ${s.watchlist_id} | ${s.results_found} found, ${s.new_results} new${s.error ? ' | ERROR: ' + s.error : ''}</div>`
        ).join('');
      }
    }

    async function loadWatchlists() {
      const res = await fetch('/api/watchlists');
      const watchlists = await res.json();
      const container = document.getElementById('watchlistFilters');

      container.innerHTML = watchlists
        .filter(w => w.active)
        .map(w => `<button class="filter-btn ${currentWatchlist === w.id ? 'active' : ''}" data-watchlist="${w.id}">${w.name}</button>`)
        .join('');

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const wid = btn.dataset.watchlist;
          currentWatchlist = currentWatchlist === wid ? null : wid;
          container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          if (currentWatchlist) btn.classList.add('active');
          loadListings();
        });
      });
    }

    async function triggerScan() {
      const btn = document.getElementById('scanBtn');
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');

      btn.disabled = true;
      btn.textContent = 'SCANNING...';
      dot.classList.add('scanning');
      txt.textContent = 'Scanning...';

      try {
        await fetch('/api/scan', { method: 'POST' });

        // Poll for completion
        const poll = setInterval(async () => {
          const res = await fetch('/api/status');
          const status = await res.json();
          if (!status.isScanning) {
            clearInterval(poll);
            btn.disabled = false;
            btn.textContent = 'SCAN NOW';
            dot.classList.remove('scanning');
            txt.textContent = 'Last scan: ' + new Date().toLocaleTimeString();
            loadListings();
            loadStats();
          }
        }, 3000);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'SCAN NOW';
        dot.classList.remove('scanning');
        txt.textContent = 'Scan failed';
      }
    }

    function openModal() { document.getElementById('modal').classList.add('active'); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    async function submitAlert(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value,
        type: form.type.value,
        keywords: form.keywords.value.split(',').map(s => s.trim()).filter(Boolean),
        titleMustContain: form.titleMustContain.value ? form.titleMustContain.value.split(',').map(s => s.trim()).filter(Boolean) : [],
        minYear: form.minYear.value ? parseInt(form.minYear.value) : undefined,
        maxYear: form.maxYear.value ? parseInt(form.maxYear.value) : undefined,
        minPrice: form.minPrice.value ? parseInt(form.minPrice.value) : undefined,
        maxPrice: form.maxPrice.value ? parseInt(form.maxPrice.value) : undefined,
        craigslistCities: form.craigslistCities.value ? form.craigslistCities.value.split(',').map(s => s.trim()).filter(Boolean) : ['birmingham'],
        sources: form.type.value === 'vehicle'
          ? ['craigslist', 'ebay', 'autotrader', 'cargurus', 'cars_com', 'copart', 'iaai']
          : ['bizbuy', 'bizquest', 'craigslist'],
      };

      await fetch('/api/watchlists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      closeModal();
      form.reset();
      loadWatchlists();
    }

    // Filter handlers
    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      document.querySelectorAll('#filters .filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      loadListings();
    });

    // Close modal on overlay click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    // Initial load
    loadListings();
    loadStats();
    loadWatchlists();

    // Auto-refresh every 60 seconds
    setInterval(() => { loadListings(); loadStats(); }, 60000);
  </script>
</body>
</html>
